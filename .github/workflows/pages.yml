name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # v0.15（再監査A08）：firestore.rules の動的試験（ローカルの Firestore Emulator・demo プロジェクトだけ。本番にはつながない・deploy もしない）
  # 版を固定：Java 17（Temurin）／Node 22／firebase-tools 14.12.0／@firebase/rules-unit-testing 3.0.4／firebase 10.14.1（package-lock.json）
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test deps
        working-directory: source/test
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rules test on emulator
        run: npx -y firebase-tools@14.12.0 emulators:exec --only firestore --project demo-lane-note --config firebase.json "node source/test/rules_check.mjs && node source/test/rules_team_check.mjs && node source/test/rules_safety_check.mjs && node source/test/rules_counter_e2e.mjs && node source/test/rules_prep_pdf_check.mjs && node source/test/rules_pubmeets_check.mjs && node source/test/rules_join_msg_check.mjs && node source/test/rules_clear_all_check.mjs && node source/test/rules_pubresults_check.mjs && node source/test/rules_astra5_check.mjs && node source/test/rules_astra5_stage2_check.mjs && node source/test/rules_astra5_stage3_check.mjs && node source/test/rules_survey_check.mjs && node source/test/rules_admin_list_check.mjs"

  # v0.28.4 テストは Pages と分けた（Hosting はこのテストだけを待つ）
  test:
    needs: rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # source/ から組み立てる（Python 3 の標準ライブラリだけで動く）
      - name: Build from source
        run: python3 source/build.py --out _site

      # リポジトリ直下の index.html・sw.js・records.html（記録帳）が、ソースからのビルド結果と1バイトも違わないか確かめる。
      # 違えば公開しない（ソースを直したのに build.py を実行し忘れた、などを防ぐ）
      - name: Check committed files match the build
        run: python3 source/build.py --check .

      # v0.14（監査F15）：架空データの回帰テスト（ネットワーク・本番の Firebase は使わない）。落ちたら公開しない
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # v0.26.10 / v0.26.13 は source/dist のビルド結果を読む（python3 source/build.py の既定の出力）
      - name: Build dist for tests
        run: python3 source/build.py

      # v0.26.52：ふりかえりシートの印刷 PDF から日本語を読むため（無いと Chrome が文字を埋め込まず、テストが落ちる）
      - name: CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Tests
        working-directory: source/test
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

  # v0.28.4 GitHub Pages（旧アドレス masarun0721.github.io）は v0.28.4 で止める。
  # 毎回ビルドせず、リポジトリに置いた固定のコピー pages_frozen/（v0.28.4・引っ越しのお知らせ入り）をそのまま出すだけ。
  # これからの修正は Firebase Hosting（lane-note.web.app）にだけ出る。Pages を完全に止めるときは、この pages の仕事を消す
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Frozen copy only (no build)
        run: test -f pages_frozen/index.html && test -f pages_frozen/.nojekyll && grep -q 'LANE NOTEは新しい住所に引っ越しました' pages_frozen/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_frozen
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  hosting:
    needs: [rules, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANE_NOTE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Skip when the secret is not set
        if: env.SA == ''
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT_LANE_NOTE が無いので Firebase Hosting には出しません"
      - name: Build from source
        if: env.SA != ''
        run: python3 source/build.py --out _site && python3 source/build.py --check .
      - name: Setup Node
        if: env.SA != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy hosting only
        if: env.SA != ''
        run: |
          test -f _site/index.html
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@14.12.0 deploy --only hosting --project lane-note --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
