name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # v0.15（再監査A08）：firestore.rules の動的試験（ローカルの Firestore Emulator・demo プロジェクトだけ。本番にはつながない・deploy もしない）
  # 版を固定：Java 17（Temurin）／Node 22／firebase-tools 14.12.0／@firebase/rules-unit-testing 3.0.4／firebase 10.14.1（package-lock.json）
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test deps
        working-directory: source/test
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rules test on emulator
        run: npx -y firebase-tools@14.12.0 emulators:exec --only firestore --project demo-lane-note --config firebase.json "node source/test/rules_check.mjs && node source/test/rules_team_check.mjs && node source/test/rules_safety_check.mjs && node source/test/rules_counter_e2e.mjs && node source/test/rules_prep_pdf_check.mjs && node source/test/rules_pubmeets_check.mjs && node source/test/rules_join_msg_check.mjs && node source/test/rules_clear_all_check.mjs"

  deploy:
    needs: rules
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # source/ から組み立てる（Python 3 の標準ライブラリだけで動く）
      - name: Build from source
        run: python3 source/build.py --out _site

      # リポジトリ直下の index.html・sw.js・records.html（記録帳）が、ソースからのビルド結果と1バイトも違わないか確かめる。
      # 違えば公開しない（ソースを直したのに build.py を実行し忘れた、などを防ぐ）
      - name: Check committed files match the build
        run: python3 source/build.py --check .

      # v0.14（監査F15）：架空データの回帰テスト（ネットワーク・本番の Firebase は使わない）。落ちたら公開しない
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # v0.26.10 / v0.26.13 は source/dist のビルド結果を読む（python3 source/build.py の既定の出力）
      - name: Build dist for tests
        run: python3 source/build.py

      - name: Tests
        working-directory: source/test
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Assemble site
        run: cp .nojekyll _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Firebase Hosting（https://lane-note.web.app ・プロジェクト lane-note）。
  # 秘密 FIREBASE_SERVICE_ACCOUNT_LANE_NOTE が無いときは失敗させず飛ばす。
  # GitHub Pages はこのジョブでは切り替えない（本体のまま。リダイレクトは別ブランチ）。
  firebase:
    needs: [rules, deploy]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Check Firebase secret
        id: fb
        env:
          FIREBASE_SERVICE_ACCOUNT_LANE_NOTE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANE_NOTE }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_LANE_NOTE" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_SERVICE_ACCOUNT_LANE_NOTE is unset. Skipping Firebase Hosting deploy."
          fi

      - name: Checkout
        if: steps.fb.outputs.deploy == 'true'
        uses: actions/checkout@v4

      - name: Build from source
        if: steps.fb.outputs.deploy == 'true'
        run: python3 source/build.py --out _site

      - name: Deploy to Firebase Hosting
        if: steps.fb.outputs.deploy == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANE_NOTE }}
          projectId: lane-note
          channelId: live
          firebaseToolsVersion: '14.12.0'
