name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # source/ から組み立てる（Python 3 の標準ライブラリだけで動く）
      - name: Build from source
        run: python3 source/build.py --out _site

      # リポジトリ直下の index.html・sw.js が、ソースからのビルド結果と1バイトも違わないか確かめる。
      # 違えば公開しない（ソースを直したのに build.py を実行し忘れた、などを防ぐ）
      - name: Check committed files match the build
        run: python3 source/build.py --check .

      - name: Assemble site
        run: cp .nojekyll _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
